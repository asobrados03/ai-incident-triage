name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build image
        run: docker build -t triage-api:ci .
      - name: Smoke test image
        run: |
          docker run -d --name triage-api-ci -p 8000:8000 triage-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root"></div>'
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '<div id="root"></div>'
      - name: Stop smoke container
        if: always()
        run: docker rm -f triage-api-ci || true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Test frontend
        run: npm test -- --run
      - name: Build frontend
        run: npm run build
