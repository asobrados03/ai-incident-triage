[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-inteligente-de-triaje-de-incidencias"
version = "0.1.0"
description = "API base para la gestión de incidencias y su futuro triaje inteligente."
requires-python = ">=3.11,<4.0"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.0,<8.0",
]
dev = [
    "mypy==2.4.1",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "evaluation/tests"]
# Dos raices de tests: importlib da nombres unicos por ruta y evita colisiones
# entre archivos con el mismo nombre.
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["backend", "evaluation"]
# Los tests viven dentro de backend/; no son codigo medido.
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # FastAPI declara dependencias como valores por defecto (Depends/Security).
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "evaluation"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "evaluation"]
# Los tests no se type-checkean: la suite es dinamica y sin anotar.
exclude = ["^backend/tests/", "^evaluation/tests/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true

[tool.setuptools.packages.find]
include = ["backend*"]
# Los tests nunca deben viajar en la distribucion instalada.
exclude = ["backend.tests*"]
