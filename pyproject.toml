[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-inteligente-de-triaje-de-incidencias"
version = "0.1.0"
description = "API base para la gestión de incidencias y su futuro triaje inteligente."
requires-python = ">=3.11,<4.0"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # FastAPI declara dependencias como valores por defecto (Depends/Security).
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "evaluation"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "evaluation"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true

[tool.setuptools.packages.find]
include = ["backend*"]
